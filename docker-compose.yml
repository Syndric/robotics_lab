services:
  ros:
    build:
      context: .
      dockerfile: Dockerfile
    image: ros-noetic-dev
    container_name: ros_noetic_lab
    stdin_open: true
    tty: true
    privileged: true
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
      - ROS_MASTER_URI=${ROS_MASTER_URI}
      - ROS_HOSTNAME=${ROS_HOSTNAME}
      - LIBGL_ALWAYS_INDIRECT=${LIBGL_ALWAYS_INDIRECT}
    volumes:
      # Mount source code and documentation as bind mounts
      - ./src:/catkin_ws/src
      - ./doc:/catkin_ws/doc
      # Use named volumes for build artifacts (preserves catkin_make output)
      - catkin_build:/catkin_ws/build
      - catkin_devel:/catkin_ws/devel
      # X11 socket for GUI applications (Linux/WSL2)
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    working_dir: /catkin_ws
    command: bash

# Named volumes for catkin build artifacts
# These persist between container restarts but are separate from your source code
volumes:
  catkin_build:
    name: robotics_lab_catkin_build
  catkin_devel:
    name: robotics_lab_catkin_devel
